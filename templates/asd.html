<script
  src="https://code.jquery.com/jquery-4.0.0.js"
  integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
  crossorigin="anonymous"
></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="login.css" />
<link
  href="https://cdn.jsdelivr.net/npm/flowbite@4.0.0/dist/flowbite.min.css"
  rel="stylesheet"
/>

<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div
    class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 min-h-screen content-center"
  >
    <!-- 로고 / 서비스명 -->
    <div class="text-center mb-8">
      <div class="text-2xl font-bold">FitRecord</div>
      <p class="text-sm text-gray-500 mt-2">운동 기록을 안전하게 관리하세요</p>
    </div>

    <!-- 로그인 폼 -->
    <form class="space-y-5">
      <!-- 이메일 -->
      <div>
        <label class="block text-sm font-medium mb-1"> 이메일 </label>
        <input
          type="email"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
          placeholder="example@email.com"
        />
      </div>

      <!-- 비밀번호 -->
      <div>
        <label class="block text-sm font-medium mb-1"> 비밀번호 </label>
        <input
          type="password"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
          placeholder="••••••••"
        />
      </div>

      <!-- 보조 옵션 -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2">
          <input type="checkbox" class="accent-blue-600" />
          로그인 유지
        </label>
        <a href="#" class="text-blue-600 hover:underline"> 비밀번호 찾기 </a>
      </div>

      <!-- 로그인 버튼 -->
      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 active:scale-[0.98] transition font-medium"
      >
        로그인
      </button>
    </form>

    <!-- 구분선 -->
    <div class="my-6 flex items-center gap-3">
      <div class="flex-1 h-px bg-gray-300"></div>
      <span class="text-xs text-gray-400">또는</span>
      <div class="flex-1 h-px bg-gray-300"></div>
    </div>

    <!-- 소셜 로그인 -->
    <div class="space-y-3">
      <button
        class="w-full border border-gray-300 py-3 rounded-lg hover:bg-gray-50 transition"
      >
        Google로 로그인
      </button>

      <button
        class="w-full border border-gray-300 py-3 rounded-lg hover:bg-gray-50 transition"
      >
        Kakao로 로그인
      </button>
    </div>

    <!-- 회원가입 -->
    <p class="text-center text-sm text-gray-500 mt-6">
      계정이 없으신가요?
      <a href="#" class="text-blue-600 hover:underline ml-1"> 회원가입 </a>
    </p>
  </div>
</div>
