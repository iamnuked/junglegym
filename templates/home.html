<!doctype html>
<html lang="en">
  <head>
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='home.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@4.0.0/dist/flowbite.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  </head>

  <body>
    <div class="p-3 flex flex-col min-h-screen">
      <div class="">
        <p class="font_medium">정글러의 득근득근한 생활을 위한</p>
        <p class="font_large font-bold">Jung/eGYM</p>
      </div>
      <div class="flex flex-1 flex-row">
        <div class="flex-2 flex flex-col">
          <div class="outline-2 rounded-[15px] space-y-7 flex-1">
            <!-- 로그인 전에 보일 부분 -->
            {% if not user %}
            <div class="login_pannel space-y-4" id="login_section">
              <input
                type="text"
                placeholder="ID"
                class="login_id_btn font_medium rounded-lg bg-[#dddddd] border-none focus:ring-2 focus:ring-black-600 focus:outline-none w-full p-4 transition"
              />
              <input
                type="password"
                placeholder="PWD"
                class="login_password_btn font_medium rounded-lg bg-[#dddddd] border-none focus:ring-2 focus:ring-black-600 focus:outline-none w-full p-4 transition"
              />
              <button
                class="font_medium rounded-lg bg-blue-600 text-white border-none w-full p-4 hover:outline-blue-800 hover:outline-2 active:bg-blue-800 transition"
                onclick="loginButton(this)"
              >
                로그인
              </button>
              <button
                class="font_medium register font_medium rounded-lg outline-[#dddddd] outline-2 border-none w-full p-4 hover:outline-black hover:outline-2 active:bg-yellow-50 transition"
                onclick="registerButton(this)"
              >
                회원가입 후 운동기록하기
              </button>
            </div>
            {% endif %}
            <!-- 로그인 후에 보일 부분 -->
            {% if user %}
            <div class="login_pannel space-y-6" id="user_section">
              <div class="flex items-start justify-between">
                <!-- 왼쪽 텍스트 -->
                <span id="txt_welcome" class="leading-relaxed text-black">
                  {{ user.name }}님의<br />
                  건강한 정글 생활을 응원합니다
                </span>

                <!-- 오른쪽 버튼 -->
                <a href="/edit" class="flex-shrink-0">

                    src="{{ url_for('static', filename='icons/edit.svg') }}"
                    class="w-6 h-6"
                  />
                </a>

                  class="start_btn font_medium rounded-lg bg-blue-600 text-white border-none w-full p-4 hover:outline-blue-800 hover:outline-2 active:bg-blue-800 transition"
                  onclick="exerciseStartAPI(this)"
                >
                  GYM출근
                </button>
              </div>
              <button
                class="w-full text-center underline"
                onclick="logoutButton(this)"
              >
                로그아웃
              </button>
            </div>
            {% endif %}

                class="font_medium dash_board_pannel rounded-lg outline-[#dddddd] outline-2 w-full p-4 hover:outline-black hover:outline-2 active:bg-yellow-50 transition"

        // 로그인 버튼
        const login_id = $(".login_id_btn").val();
        const login_password = $(".login_password_btn").val();

        $.ajax({
          type: "post",
          url: "/login",
          data: {
            id_give: login_id,
            pw_give: login_password,
          },
          success: (response) => {
            console.log(response);
            if (response.success) {
              location.reload();
            }
          },
        });
      }
