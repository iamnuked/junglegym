<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
    crossorigin="anonymous"></script>

  <!-- Tailwind -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.0/dist/flowbite.min.css" rel="stylesheet" />

  <title>Jung/eGYM 회원정보수정</title>
</head>

<body class="p-4 bg-white">
  <div class="flex h-screen w-full p-8">
    <!-- 왼쪽 영역 -->
    <div class="mx-auto p-8 text-center flex-1">
      <div class="text-center">
        <h1 class="text-4xl font-extrabold leading-tight">
          Jung/eGYM<br />
          <span class="font-extrabold">회원정보수정</span>
        </h1>
      </div>
    </div>

    <!-- 오른쪽 영역 -->
    <div class="mx-auto p-8 flex-[2]">
      <div class="signup_menu flex flex-col gap-6">
        <form id="edit_form" methods="POST" action="/profile-edit" class="space-y-4">
          <!-- 이름 -->
          <div class="flex flex-col gap-1">
            <label for="name" class="text-base font-medium text-black">이름</label>
            <input id="name" name="name_give" type="text" value="{{ user.name }}" data-original="{{ user.name }}"
              class="w-[50%] bg-gray-200 border-none outline-none p-2" />
          </div>

          <!-- 아이디 -->
          <div class="flex flex-col gap-1">
            <label for="id" class="text-base font-medium text-black">아이디</label>
            <input id="id" type="text" value="{{ user.id }}"
              class="w-[50%] bg-gray-100 text-gray-500 border-none outline-none p-2 placeholder-gray-400" readonly />
          </div>

          <!-- 비밀번호 -->
          <div class="flex flex-col gap-1">
            <label for="pw" class="text-base font-medium text-black">비밀번호</label>
            <input id="pw" name="pw_give" type="password" placeholder="새 비밀번호 입력 (미입력 시 유지)"
              class="w-[50%] bg-gray-200 border-none outline-none p-2 placeholder-gray-400" />
          </div>

          <!-- 기수 및 번호 -->
          <div class="flex flex-col gap-1">
            <label for="gen" class="text-base font-medium text-black">기수 및 번호</label>
            <select id="gen" name="gen_give" data-original="{{user.gen}}"
              class="w-[50%] bg-gray-200 border-none outline-none p-2 text-black">
              <option value="12기" {{ 'selected' if user.gen=='12기' else '' }}>12기</option>
              <option value="13기" {{ 'selected' if user.gen=='13기' else '' }}>13기</option>
            </select>

            <input id="number" name="number_give" type="number" value="{{ user.number }}"
              data-original="{{user.number}}"
              class="w-[50%] bg-gray-200 border-none outline-none p-2 placeholder-gray-400" />
          </div>
          <div class="mt-2 flex flex-col items-end gap-3 w-[50%]">
            <div class="flex gap-3 justify-end w-full">
              <a href="/" class="w-32 bg-gray-200 hover:bg-gray-300 p-2 text-center">
                취소
              </a>
              <button id="edit_btn" type="submit" class="w-32 bg-gray-200 hover:bg-gray-300 p-2 text-center">
                변경
              </button>
            </div>
          </div>
        </form>
        <form id="delete_form" methods="POST" action="/delete" class="w-[50%] flex justify-end">
          <button id="delete_btn" type="submit" class="w-32 underline hover:text-gray-400 p-2 text-center">
            회원탈퇴
          </button>
        </form>
      </div>
    </div>
  </div>
  <script>
    $(function () {

      $("#edit_form").submit(function (e) {

        // 현재 값
        const nameNow = $("#name").val();
        const genNow = $("#gen").val();
        const numberNow = $("#number").val();
        const pwNow = $("#pw").val().trim();

        // 원본 값
        const nameOld = $("#name").data("original");
        const genOld = $("#gen").data("original");
        const numberOld = $("#number").data("original");

        // 변경 여부 계산
        const changed =
          nameNow !== nameOld ||
          genNow !== genOld ||
          String(numberNow) !== String(numberOld) ||
          pwNow !== "";   // 비밀번호는 입력되면 변경

        // 변경 없으면 제출 막기
        if (!changed) {
          e.preventDefault();
          alert("변경된 내용이 없습니다.");
        }else {
          alert("변경되었습니다.");
        }

      });
      $("#delete_form").submit(async function (e) {
        e.preventDefault();
        const ok = confirm("회원탈퇴 하시겠습니까?");
        if (!ok) return;
        try {
          const res = await fetch("/delete", {
            methods: "POST",
            credentials: "include"
          });
          if (!res.ok) throw new Error("delete failed");
          window.location.replace("/");
        } catch (err) {
          alert("회원탈퇴 중 오류가 발생했습니다.");
        }
      });
    });
  </script>
</body>

</html>
