<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@4.0.0/dist/flowbite.min.css"
      rel="stylesheet"
    />

    <title>Jung/eGYM 회원정보수정</title>
  </head>

  <body class="p-4 bg-white">
    <div class="flex h-screen w-full p-8">
      <!-- 왼쪽 영역 -->
      <div class="mx-auto p-8 text-center flex-1">
        <div class="text-center">
          <h1 class="text-4xl font-extrabold leading-tight">
            Jung/eGYM<br />
            <span class="font-extrabold">회원정보수정</span>
          </h1>
        </div>
      </div>

      <!-- 오른쪽 영역 -->
      <div class="mx-auto p-8 flex-[2]">
        <div class="signup_menu flex flex-col gap-6">
          <form method="POST" action="/profile-edit" class="space-y-4">
            <!-- 이름 -->
            <div class="flex flex-col gap-1">
              <label for="name" class="text-base font-medium text-black"
                >이름</label
              >
              <input
                id="name"
                name="name_give"
                type="text"
                value="{{ user.name }}"
                class="w-[50%] bg-gray-200 border-none outline-none p-2"
              />
            </div>

            <!-- 아이디 -->
            <div class="flex flex-col gap-1">
              <label for="id" class="text-base font-medium text-black"
                >아이디</label
              >
              <input
                id="id"
                type="text"
                value="{{ user.id }}"
                class="w-[50%] bg-gray-100 text-gray-500 border-none outline-none p-2 placeholder-gray-400"
                readonly
              />
            </div>

            <!-- 비밀번호 -->
            <div class="flex flex-col gap-1">
              <label for="pw" class="text-base font-medium text-black"
                >비밀번호</label
              >
              <input
                id="pw"
                name="pw_give"
                type="password"
                placeholder="새 비밀번호 입력 (미입력 시 유지)"
                class="w-[50%] bg-gray-200 border-none outline-none p-2 placeholder-gray-400"
              />
            </div>

            <!-- 기수 및 번호 -->
            <div class="flex flex-col gap-1">
              <label for="gen" class="text-base font-medium text-black"
                >기수 및 번호</label
              >
              <select
                id="gen"
                name="gen_give"
                class="w-[50%] bg-gray-200 border-none outline-none p-2 text-black"
              >
                <option value="12기" {{ 'selected' if user.gen == '12기' else '' }}>12기</option>
                <option value="13기" {{ 'selected' if user.gen == '13기' else '' }}>13기</option>
              </select>

              <input
                id="number"
                name="number_give"
                type="number"
                value="{{ user.number_receive }}"
                class="w-[50%] bg-gray-200 border-none outline-none p-2 placeholder-gray-400"
              />
            </div>
            <div class="mt-2 flex flex-col items-end gap-3 w-[50%]">
              <div class="flex gap-3 justify-end w-full">
                <a
                  href="/"
                  class="w-32 bg-gray-200 hover:bg-gray-300 p-2 text-center"
                >
                  취소
                </a>
                <button
                  id="edit_btn"
                  type="submit"
                  class="w-32 bg-gray-200 hover:bg-gray-300 p-2 text-center"
                >
                  변경
                </button>
              </div>
            </div>
          </form>
          <form method="POST" action="/delete" class="w-[50%] flex justify-end">
            <button
              id="delete_btn"
              type="submit"
              class="w-32 underline hover:text-gray-400 p-2 text-center"
            >
              회원탈퇴
            </button>
          </form>
        </div>
      </div>
    </div>
    <script>
      $(function () {
        $.ajax({
          type: "GET",
          url: "/me",
          credentials: "include",
        });
      });
    </script>
  </body>
</html>
