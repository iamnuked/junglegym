<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.0/dist/flowbite.min.css" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/signup.css">
    <title>Jung/eGYM 회원가입</title>
</head>

<body class="p-4 bg-white">
    <div class="flex h-screen w-full p-8">
        <!-- 왼쪽 영역 -->
        <div class="mx-auto p-8 text-center flex-1">
            <div class="text-center">
                <h1 class="text-4xl font-extrabold leading-tight">
                    Jung/eGYM<br />
                    <span class="font-extrabold">회원가입</span>
                </h1>
            </div>
        </div>

        <!-- 오른쪽 영역 -->
        <div class="mx-auto p-8 flex-[2]">
            <div class="mb-10">
                <p class="text-2xl text-black">
                    JUNGLEGYM에서 운동을 기록하고<br class="hidden sm:block" />
                    더 정확한 GYM 혼잡도를 함께 만들어 보세요.
                </p>
            </div>

            <div class="signup_menu flex flex-col gap-6">
                <!-- 이름 -->
                <div class="flex flex-col gap-1">
                    <label for="name" class="text-base font-medium text-black">이름</label>
                    <input id="name" type="text" placeholder="이름을 입력해 주세요."
                        class="w-[50%] bg-gray-200 border-none outline-none p-2 placeholder-gray-400" />
                </div>

                <!-- 아이디 -->
                <div class="flex flex-col gap-1">
                    <label for="id" class="text-base font-medium text-black">아이디</label>
                    <input id="id" type="text" placeholder="아이디를 입력해 주세요."
                        class="w-[50%] bg-gray-200 border-none outline-none p-2 placeholder-gray-400" />
                </div>

                <!-- 비밀번호 -->
                <div class="flex flex-col gap-1">
                    <label for="pw" class="text-base font-medium text-black">비밀번호</label>
                    <input id="pw" type="password" placeholder="비밀번호를 입력해 주세요."
                        class="w-[50%] bg-gray-200 border-none outline-none p-2 placeholder-gray-400" />
                </div>

                <!-- 기수 및 번호 -->
                <div class="flex flex-col gap-1">
                    <label for="gen" class="text-base font-medium text-black">기수 및 번호</label>
                    <select id="gen" class="w-[50%] bg-gray-200 border-none outline-none p-2 text-black">
                        <option>12기</option>
                        <option>13기</option>
                    </select>
                    <input id="number" type="number" placeholder="정글 카드키에 기재된 번호를 입력해 주세요."
                        class="w-[50%] bg-gray-200 border-none outline-none p-2 placeholder-gray-400" />
                </div>

                <button id="join_btn" type="button" class="w-32 bg-gray-200 hover:bg-gray-300 mt-2 p-2 text-center">
                    회원가입
                </button>
            </div>
        </div>
    </div>
    <script>
        $("#join_btn").click(function(){
            let name = $("#name").val()
            let id = $("#id").val()
            let pw = $("#pw").val()
            let gen = $("#gen").val()
            let number = $("#number").val()

            $.ajax({
                type: "POST",
                url: "/join",
                data: {
                    name: name,
                    id: id,
                    pw: pw,
                    gen: gen,
                    number: number
                },
                success: function(response){
                    if (response["result"] == "success") {
                        alert("회원가입이 완료되었습니다.");
                    } else {
                        alert("회원가입에 실패했습니다");
                    }
                }
            })
        })
    </script>
</body>

</html>
